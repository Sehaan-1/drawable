[project]
name = "drawable-research-contracts"
version = "0.1.0"
description = "Versioned local research and viewpoint-review contracts shared by API and ML tools"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.8,<3"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawable_research_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"src/drawable_research_contracts/py.typed" = "drawable_research_contracts/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
