[project]
name = "linescout-ml"
version = "0.1.0"
description = "LineScout dataset manifest schema, validation, and (later) ingestion, training, and evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.scripts]
linescout-manifest = "linescout_ml.cli:main"
# Reproducibility toolbox: pinned checkout, pinned environment, pinned checkpoints.
linescout-repro = "linescout_ml.repro_cli:main"

[project.optional-dependencies]
# The Colab GPU pipeline (linescout_ml.colab) needs image and array libraries,
# but the manifest schema and taxonomy stay pydantic-only so a fresh clone can
# validate a manifest without pulling in half of PyPI.
pipeline = [
    "numpy>=1.26",
    "pillow>=10.4",
]
# Everything the Colab notebook installs on a GPU runtime. torch/torchvision are
# listed for completeness — Colab already ships a CUDA build, and the notebook
# deliberately does not reinstall them.
# Everything the Colab notebook installs on a GPU runtime, as the *floors* of the
# pins in ml/colab/requirements-colab.txt. CI (``linescout-repro selfcheck``)
# checks the two name sets agree, so a dependency cannot land in one and not the
# other. torch/torchvision are listed for completeness only: Colab ships a CUDA
# build and the notebook freezes what it finds instead of reinstalling it.
gpu = [
    "linescout-ml[pipeline]",
    "torch>=2.4",
    "torchvision>=0.19",
    "controlnet-aux>=0.0.9",
    "open-clip-torch>=3.1",
    "timm>=1.0",
    "opennsfw2>=0.16",
    # Declared by opennsfw2, which fetches its own weights with it.
    "gdown>=6.0",
    "huggingface-hub>=0.30",
    "safetensors>=0.5",
    "einops>=0.8",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "scipy>=1.13",
    "filelock>=3.15",
    "regex>=2024.5",
    "ftfy>=6.2",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "numpy>=1.26",
    "pillow>=10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linescout_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# A Colab cell is not a module. Two of E402's complaints are idiomatic there: an
# explanatory docstring above the imports, and importing `linescout_ml` after the
# cell that put it on sys.path. The notebook's *content* is held to account by
# linescout-repro selfcheck and tests/test_colab_notebook.py instead.
"colab/*.ipynb" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# The GPU stack is optional and is imported lazily, so CI type-checks without it.
[[tool.mypy.overrides]]
module = [
    "PIL.*",
    "numpy.*",
    "torch.*",
    "open_clip.*",
    "controlnet_aux.*",
    "opennsfw2.*",
    "huggingface_hub.*",
    "google.colab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
