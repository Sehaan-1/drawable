[project]
name = "drawable-ml"
version = "0.1.0"
description = "Local, gated model preparation and reproducible research experiments for Drawable"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "pillow>=11,<13",
  "safetensors>=0.5,<1",
  "drawable-research-contracts",
]

[tool.uv.sources]
drawable-research-contracts = { path = "../packages/research-contracts", editable = true }
torch = { index = "pytorch-cpu", extra = "cpu" }
torchvision = { index = "pytorch-cpu", extra = "cpu" }

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
cpu = [
  "torch==2.7.0",
  "torchvision==0.22.0",
  "timm==1.0.17",
  "open_clip_torch==3.2.0",
  "transformers>=4.52,<5",
]
cuda = [
  "torch==2.7.0",
  "torchvision==0.22.0",
  "timm==1.0.17",
  "open_clip_torch==3.2.0",
  "transformers>=4.52,<5",
]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "pytest>=8,<10"]

[project.scripts]
drawable-ml = "drawable_ml.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawable_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
