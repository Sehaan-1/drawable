[project]
name = "drawable-api"
version = "0.1.0"
description = "Local API and reproducible data intake tools for drawable"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "pydantic>=2.8,<3",
  "drawable-research-contracts",
  "uvicorn>=0.30,<1",
]

[tool.uv.sources]
drawable-research-contracts = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
drawable = "drawable_api.cli:main"
drawable-api = "drawable_api.cli:api_main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawable_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
